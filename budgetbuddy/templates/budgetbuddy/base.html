{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#3ecf8e">
    <meta name="application-name" content="BudgetMe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="BudgetMe">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>{% block title %}BudgetMe{% endblock %} — Uganda</title>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="{% static 'budgetbuddy/css/dashboard.css' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'budgetbuddy/icons/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'budgetbuddy/icons/icon-192.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'budgetbuddy/icons/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% url 'web_manifest' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        {% block sidebar %}{% endblock %}
        <div class="page-wrap">
            {% block content %}{% endblock %}
        </div>
        {% block mobile_nav %}{% endblock %}
    </div>
    <script src="{% static 'budgetbuddy/js/ugx_amounts.js' %}"></script>
    <script src="{% static 'budgetbuddy/js/auth.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
