{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3ecf8e">
    <title>{% block title %}BudgetMe{% endblock %} </title>
    
    <meta name="theme-color" content="#22c55e">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        {% block sidebar %}{% endblock %}
        <div class="page-wrap">
            {% block content %}{% endblock %}
        </div>
        {% block mobile_nav %}{% endblock %}
    </div>
    <script src="{% static 'budgetbuddy/js/ugx_amounts.js' %}"></script>
    <script src="{% static 'budgetbuddy/js/auth.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
