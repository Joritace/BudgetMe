{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3ecf8e">
    <title>{% block title %}BudgetMe{% endblock %} </title>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'icons/site.webmanifest' %}">
    <link rel="shortcut icon" href="{% static 'icons/favicon.ico' %}">
    <meta name="theme-color" content="#22c55e">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        {% block sidebar %}{% endblock %}
        <div class="page-wrap">
            {% block content %}{% endblock %}
        </div>
        {% block mobile_nav %}{% endblock %}
    </div>
    <script src="{% static 'budgetbuddy/js/ugx_amounts.js' %}"></script>
    <script src="{% static 'budgetbuddy/js/auth.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
