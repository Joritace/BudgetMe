<header class="page-header">
    <div class="page-header__text">
        <h1><i class="bx {{ icon }}" aria-hidden="true"></i> {{ title }}</h1>
        {% if subtitle %}<p class="page-sub">{{ subtitle }}</p>{% endif %}
    </div>
    {% if back_url %}
    <a href="{{ back_url }}" class="btn btn-ghost btn-sm"><i class="bx bx-arrow-back"></i> Back</a>
    {% endif %}
</header>
