{% if messages %}
<ul class="messages" id="bb-messages" aria-live="polite">
    {% for message in messages %}
    <li class="message message--{{ message.tags|default:'success' }}">{{ message }}</li>
    {% endfor %}
</ul>
{% else %}
<ul class="messages" id="bb-messages" aria-live="polite" hidden></ul>
{% endif %}
