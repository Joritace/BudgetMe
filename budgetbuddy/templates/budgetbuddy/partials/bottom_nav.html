{% load budgetbuddy_tags %}
<nav class="bottom-nav" aria-label="Main navigation">
    <div class="bottom-nav__inner">
        {% for item in nav_items %}
        <a href="{% nav_url item %}"
           class="nav-item {% if item.active %}active{% endif %}"
           {% if item.active %}aria-current="page"{% endif %}>
            <span class="nav-icon {% if item.active %}active{% endif %}">
                <i class="bx {{ item.icon }}" aria-hidden="true"></i>
            </span>
            <span class="nav-label">{{ item.label }}</span>
        </a>
        {% endfor %}
        {% if request.user.is_authenticated %}
        <form method="post" action="{% url 'account_logout' %}" class="bottom-nav__logout">
            {% csrf_token %}
            <button type="submit" class="nav-item nav-item--logout" aria-label="Sign out">
                <span class="nav-icon">
                    <i class="bx bx-log-out" aria-hidden="true"></i>
                </span>
                <span class="nav-label">Sign out</span>
            </button>
        </form>
        {% endif %}
    </div>
</nav>
