<aside class="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand">
        <span class="brand-mark"><i class="bx bx-coin-stack" aria-hidden="true"></i></span>
        <div>
            <p class="brand-name">BudgetMe</p>
            <p class="brand-tag">Uganda</p>
        </div>
    </div>
    <nav class="sidebar-nav">
        {% for item in nav_items %}
        <a href="{% if item.url_name %}{% url item.url_name %}{% else %}{{ item.url }}{% endif %}"
           class="sidebar-link {% if item.active %}active{% endif %}"
           {% if item.active %}aria-current="page"{% endif %}>
            <i class="bx {{ item.icon }}" aria-hidden="true"></i>
            {{ item.label }}
        </a>
        {% endfor %}
    </nav>
    <div class="sidebar-user">
        <div class="avatar">{{ first_name|slice:":1" }}</div>
        <div>
            <p class="user-name">{{ user.name }}</p>
            <p class="user-meta">{{ data.currency }} budget</p>
        </div>
    </div>
</aside>
